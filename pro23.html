<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>multipication</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color:aqua;
        text-align: center;
    }
    input,button {
        padding: 10px;
        margin: 10px;
    }
    button{
        background: #00ffcc;
        border: 0;
        border-radius: 5px;

    }
</style>
<body>
    <input id="a" type="number" placeholder="number-1">
    <input id="b" type="number" placeholder="number-2">
    <button onclick="multiply()">Multiply</button><h3 id="result"></h3>
</body>
    <script>
        function multiply() {
            let num1 = parseFloat(document.getElementById("a").value);
            let num2 = parseFloat(document.getElementById("b").value);
            let result = num1 * num2;
            document.getElementById("result").innerText = "Result: " + result;
        }

</script>
</html>
